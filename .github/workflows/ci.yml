name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # the pinned toolchain and its components come from rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # the PyO3 module cannot link a test binary outside Python
      - run: cargo test --workspace --exclude snn-live-py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      # no GPU here: the CUDA tests skip themselves, the rest runs on numpy
      - run: uv run --no-project --with numpy --with pytest python -m pytest mnist-snn-cuda/tests mnist-sg-cuda/tests scripts
        env:
          PYTHONPATH: mnist-snn-cuda/src:mnist-sg-cuda/src
