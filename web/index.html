<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNN training</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "Barlow"; font-weight: 400; font-display: swap; src: url(/fonts/barlow-400.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 500; font-display: swap; src: url(/fonts/barlow-500.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 400; font-display: swap; src: url(/fonts/barlow-condensed-400.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(/fonts/barlow-condensed-600.woff2) format("woff2"); }
:root {
  --bg: #081a12; --board: #123524; --text: #eef2ee; --muted: #8adbb8; --soft: #bfebd6;
  --a400: #52c495; --a500: #23a676; --a600: #11865c; --a800: #0c4a33;
  --divider: color-mix(in srgb, #eef2ee 18%, transparent);
  --good: #0ca30c; --bad: #ec835a;
  --fh: "Barlow Condensed", system-ui, sans-serif; --fb: "Barlow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 var(--fb); }
.app {
  min-height: 100vh; height: 100vh; display: grid; gap: 18px; padding: 20px 24px;
  grid-template-rows: auto minmax(0, 1fr) 150px;
  background-color: var(--board);
  background-image: linear-gradient(color-mix(in srgb, var(--text) 4%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--text) 4%, transparent) 1px, transparent 1px);
  background-size: 40px 40px;
}
.k { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--fh); font-weight: 600; line-height: 1; }
.unit { font-size: .5em; color: var(--muted); margin-left: 2px; }
canvas { display: block; width: 100%; height: 100%; }
.bp { position: relative; border: 1px solid var(--divider); min-height: 0; }
.bp > i { position: absolute; width: 11px; height: 11px; color: color-mix(in srgb, var(--text) 55%, transparent); }
.bp > i::before, .bp > i::after { content: ""; position: absolute; background: currentColor; }
.bp > i::before { left: 5px; top: 0; width: 1px; height: 100%; }
.bp > i::after { top: 5px; left: 0; width: 100%; height: 1px; }
.bp > i:nth-of-type(1) { top: -6px; left: -6px; } .bp > i:nth-of-type(2) { top: -6px; right: -6px; }
.bp > i:nth-of-type(3) { bottom: -6px; left: -6px; } .bp > i:nth-of-type(4) { bottom: -6px; right: -6px; }
.bp > .k { position: absolute; left: 12px; top: 8px; pointer-events: none; }

header { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; gap: 4px; padding-left: 16px; border-left: 1px solid var(--divider); }
.stat .num { font-size: 30px; font-variant-numeric: tabular-nums; }
.hero { padding-left: 0; border: 0; }
.hero .num { font-size: 56px; font-variant-numeric: normal; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--divider); }
.seg label { padding: 9px 12px; font: 600 15px var(--fh); letter-spacing: .06em; cursor: pointer; }
.seg label + label { border-left: 1px solid var(--divider); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--a500); color: var(--bg); }
.seg label:has(input:focus-visible), .btn:focus-visible { outline: 2px solid var(--a400); outline-offset: 2px; }
.btn { height: 42px; min-width: 112px; padding: 0 20px; border: 1px solid var(--a500); background: var(--a500); color: var(--bg);
  font: 600 16px var(--fh); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
.btn:hover { background: var(--a600); }
.btn:disabled { opacity: .5; cursor: default; }

main { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; gap: 22px; min-height: 0; }
.col { display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden; }
.rows > div { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; border-top: 1px solid var(--divider); }
.rows > div:last-child { border-bottom: 1px solid var(--divider); }
.rows span:first-child { color: var(--soft); font-size: 13px; }
.rows .num { font-size: 20px; font-variant-numeric: tabular-nums; }
.meter { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.meter > div:first-child { display: flex; justify-content: space-between; align-items: baseline; font: 15px var(--fh); text-transform: uppercase; letter-spacing: .04em; }
.meter .track { height: 2px; background: var(--a800); }
.meter .fill { height: 100%; width: 0; background: var(--muted); transition: width .3s; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--soft); margin-top: 6px; }
.legend span::before { content: ""; display: inline-block; vertical-align: middle; margin-right: 6px; }
.legend .ln::before { width: 14px; height: 2px; background: var(--a400); }
.legend .dt::before { width: 8px; height: 8px; border-radius: 50%; background: var(--text); }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { text-align: right; font-weight: 400; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 0; border-bottom: 1px solid var(--divider); }
td { text-align: right; padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--text) 8%, transparent); }
th:first-child, td:first-child { text-align: left; }
.center { display: grid; grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; min-height: 0; }
.probe-name { font-size: 44px; text-transform: uppercase; }
.pair { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pair > div { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--divider); padding-top: 6px; }
.pair .num { font-size: 24px; font-variant-numeric: tabular-nums; }
.decision { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--divider); padding-top: 8px; flex: 1; min-height: 0; }
.verdict { display: flex; align-items: flex-end; gap: 16px; }
.digit { font-size: 96px; line-height: .8; color: var(--muted); }
.truth { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--soft); }
.badge { font: 600 15px var(--fh); letter-spacing: .08em; text-transform: uppercase; }
.badge.ok { color: var(--good); } .badge.miss { color: var(--bad); }
#tip { position: fixed; pointer-events: none; z-index: 10; padding: 6px 10px; background: var(--bg); border: 1px solid var(--divider);
  font-size: 12px; color: var(--soft); display: none; white-space: nowrap; }
#tip b { color: var(--text); font: 600 15px var(--fh); margin-right: 6px; }
#conn { position: fixed; right: 16px; bottom: 12px; font-size: 12px; color: var(--bad); display: none; }
@media (max-width: 1100px) {
  .app { height: auto; grid-template-rows: auto auto 150px; }
  main { grid-template-columns: 1fr; }
  .center { grid-template-rows: 420px 320px; }
  #trace { height: 110px; } #classes { height: 120px; } #acc { height: 120px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="stat hero"><span class="k">Running accuracy</span><span class="num" id="acc-v">–</span></div>
    <div class="stat"><span class="k">Test accuracy</span><span class="num" id="test-v">–</span></div>
    <div class="stat"><span class="k">Epoch</span><span class="num" id="epoch-v">–</span></div>
    <div class="stat"><span class="k">Image</span><span class="num" id="image-v">–</span></div>
    <div class="stat"><span class="k">Sim time</span><span class="num" id="clock-v">–</span></div>
    <div class="stat"><span class="k">Images / s</span><span class="num" id="ips-v">–</span></div>
    <div class="stat"><span class="k">Spikes / img</span><span class="num" id="spk-v">–</span></div>
    <div class="stat" title="synaptic operations: each spike counted once per synapse it reaches"><span class="k">SynOps / img</span><span class="num" id="syn-v">–</span></div>
    <div id="xstats" style="display:contents"></div>
    <div class="spacer"></div>
    <div class="seg" id="speed" role="radiogroup" aria-label="Simulation speed"></div>
    <button class="btn" id="toggle" disabled>Pause</button>
  </header>

  <main>
    <div class="col">
      <div>
        <div class="k" style="padding-bottom:6px" id="model-title"></div>
        <div class="rows" id="model"></div>
      </div>
      <div id="firing"></div>
      <div style="display:flex;flex-direction:column;min-height:0;flex:1">
        <div class="k">Accuracy</div>
        <div style="flex:1;min-height:90px"><canvas id="acc"></canvas></div>
        <div class="legend"><span class="ln">running</span><span class="dt">test</span></div>
        <table><thead><tr><th>Epoch</th><th>Train</th><th>Test</th><th>SynOps</th></tr></thead><tbody id="epochs"></tbody></table>
      </div>
    </div>

    <div class="center" id="center"></div>

    <div class="col" id="right"></div>
  </main>

  <div class="bp" id="bottom"></div>
</div>
<div id="tip"></div>
<div id="conn">disconnected · retrying</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const G = { p: "#eef2ee", 2: "#bfebd6", 3: "#8adbb8", 4: "#52c495", 5: "#23a676", 6: "#11865c", 7: "#0b6646", 8: "#0c4a33", 9: "#123524" };
const pa = (a) => `rgba(238,242,238,${a})`, ga = (a) => `rgba(138,219,184,${a})`, gb = (a) => `rgba(82,196,149,${a})`;
const FH = '"Barlow Condensed", system-ui, sans-serif';
const SPEEDS = [["0.2×", 200], ["1×", 1000], ["5×", 5000], ["20×", 20000], ["Max", 0]];
const NONE = 255;

// ---- state -------------------------------------------------------------------------------
const S = {
  meta: null, nIn: 0, T: 200, side: 28, params: [], paramTitle: "", pops: [], floor: -Infinity,
  img: null, label: -1, learn: true,
  acc: [], tests: [], epochs: [], progress: null, state: { paused: false, speed: 1000, done: false },
  hover: null, dirty: new Set(["all"]),
};
const dirty = (...k) => k.forEach((x) => S.dirty.add(x));

// model views register here; META picks one by name
const VIEWS = {};
let view = null;
const registerView = (name, v) => { VIEWS[name] = v; };

// ---- protocol (see crates/snn-live/src/frame.rs) ------------------------------------------
const TD = new TextDecoder();
// a u16-length-prefixed string at p, and the offset after it
const str = (v, p) => { const n = v.getUint16(p, true); return [TD.decode(new Uint8Array(v.buffer, v.byteOffset + p + 2, n)), p + 2 + n]; };

const H = {
  1(v, p) { // META
    const m = { w: v.getUint16(p, true), h: v.getUint16(p + 2, true), classes: v.getUint8(p + 4), nTrain: v.getUint32(p + 5, true),
      nTest: v.getUint32(p + 9, true), epochs: v.getUint16(p + 13, true), T: v.getUint16(p + 15, true), dt: v.getFloat32(p + 17, true) };
    let o;
    [m.model, o] = str(v, p + 21);
    [m.name] = str(v, o);
    S.meta = m; S.nIn = m.w * m.h; S.T = m.T; S.side = m.w; S.img = new Uint8Array(S.nIn);
    if (VIEWS[m.model] !== view) {
      view = VIEWS[m.model];
      for (const id of ["firing", "center", "right", "bottom", "xstats"]) $(id).replaceChildren();
      if (view) { view.layout(); corners(document); }
    }
    S.acc = []; S.tests = []; S.epochs = [];
    renderEpochs(); dirty("all");
  },
  11(v, p) { // PARAMS
    let o, n;
    [S.paramTitle, o] = str(v, p);
    n = v.getUint8(o++);
    S.params = [];
    for (let k = 0; k < n; k++) {
      const q = {};
      [q.name, o] = str(v, o); q.value = v.getFloat32(o, true); [q.text, o] = str(v, o + 4); [q.unit, o] = str(v, o);
      S.params.push(q);
    }
    const floor = S.params.find((q) => q.name === "Floor");
    S.floor = floor ? floor.value : -Infinity;
    renderModel();
  },
  12(v, p) { // POPS
    const n = v.getUint8(p);
    let o = p + 1;
    S.pops = [];
    for (let k = 0; k < n; k++) {
      const q = {};
      [q.name, o] = str(v, o);
      q.size = v.getUint16(o, true); q.w = v.getUint16(o + 2, true); q.h = v.getUint16(o + 4, true); q.role = v.getUint8(o + 6); o += 7;
      S.pops.push(q);
    }
    if (view && view.pops) view.pops();
  },
  2(v, p) { // IMAGE
    S.label = v.getUint8(p + 14); S.learn = v.getUint8(p + 15) === 1;
    S.img = new Uint8Array(v.buffer.slice(v.byteOffset + p + 16, v.byteOffset + p + 16 + S.nIn));
    if (view && view.image) view.image();
  },
  6(v, p) { // EPOCH
    const e = { epoch: v.getUint16(p, true) + 1, train: v.getFloat32(p + 2, true), test: v.getFloat32(p + 6, true), images: v.getFloat64(p + 14, true), synops: v.getFloat32(p + 26, true) };
    if (S.epochs.some((x) => x.epoch === e.epoch)) return;
    S.epochs.push(e);
    if (!Number.isNaN(e.test)) S.tests.push([e.images, e.test]);
    renderEpochs(); dirty("acc", "stats");
  },
  7(v, p) { // STATE
    S.state = { paused: v.getUint8(p) === 1, speed: v.getUint32(p + 1, true), done: v.getUint8(p + 5) === 1 };
    renderControls();
  },
  8(v, p) { // PROGRESS
    const g = { epoch: v.getUint16(p, true), index: v.getUint32(p + 2, true), total: v.getUint32(p + 6, true), learn: v.getUint8(p + 10) === 1,
      acc: v.getFloat32(p + 11, true), steps: v.getFloat64(p + 15, true), images: v.getFloat64(p + 23, true), ips: v.getFloat32(p + 31, true),
      spikes: v.getFloat32(p + 35, true), synops: v.getFloat32(p + 39, true) };
    S.progress = g;
    const last = S.acc[S.acc.length - 1];
    if (g.learn && g.images > 0 && (!last || last[0] < g.images)) {
      S.acc.push([g.images, g.acc]);
      if (S.acc.length > 4000) S.acc = S.acc.filter((_, i) => i % 2 === 0);
      dirty("acc");
    }
    dirty("stats");
  },
  10(v, p) { // HISTORY
    const series = v.getUint8(p), n = v.getUint32(p + 1, true), pts = [];
    for (let i = 0; i < n; i++) pts.push([v.getUint32(p + 5 + 8 * i, true), v.getFloat32(p + 9 + 8 * i, true)]);
    if (series === 0) { S.acc = pts; dirty("acc"); } else if (view && view.history) view.history(series, pts);
  },
};

function onPacket(buf) {
  const v = new DataView(buf);
  for (let at = 0; at < v.byteLength;) {
    const kind = v.getUint8(at), len = v.getUint32(at + 1, true);
    const h = H[kind] || (view && view.H[kind]);
    if (h && (S.meta || kind === 1 || kind === 7)) h(v, at + 5);
    at += 5 + len;
  }
}

let ws = null;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { $("conn").style.display = "none"; };
  ws.onmessage = (e) => onPacket(e.data);
  ws.onclose = () => { $("conn").style.display = "block"; $("toggle").disabled = true; setTimeout(connect, 1000); };
}
const send = (cmd) => ws && ws.readyState === 1 && ws.send(cmd);

// ---- DOM panels ---------------------------------------------------------------------------
function renderModel() {
  $("model-title").textContent = S.paramTitle;
  const rows = S.params.map((q) => [q.name, q.text || +q.value.toPrecision(3), q.unit]);
  const box = $("model");
  box.replaceChildren(...rows.map(([k, val, u]) => {
    const d = document.createElement("div"), a = document.createElement("span"), b = document.createElement("span");
    a.textContent = k; b.className = "num"; b.textContent = val;
    if (u) { const s = document.createElement("span"); s.className = "unit"; s.textContent = u; b.append(s); }
    d.append(a, b); return d;
  }));
}

function renderEpochs() {
  const pct = (x) => (Number.isNaN(x) ? "–" : (x * 100).toFixed(1) + "%");
  $("epochs").replaceChildren(...S.epochs.slice(-3).map((e) => {
    const tr = document.createElement("tr");
    for (const c of [e.epoch, pct(e.train), pct(e.test), e.synops > 0 ? compact(e.synops) : "–"]) { const td = document.createElement("td"); td.textContent = c; tr.append(td); }
    return tr;
  }));
}

function renderControls() {
  const seg = $("speed");
  if (!seg.childElementCount) {
    for (const [name, sp] of SPEEDS) {
      const l = document.createElement("label"), i = document.createElement("input");
      i.type = "radio"; i.name = "speed"; i.value = sp;
      i.onchange = () => send(`speed ${sp}`);
      l.append(i, name); seg.append(l);
    }
  }
  for (const i of seg.querySelectorAll("input")) i.checked = Number(i.value) === S.state.speed;
  const b = $("toggle");
  b.disabled = S.state.done;
  b.textContent = S.state.done ? "Done" : S.state.paused ? "Run" : "Pause";
}
$("toggle").onclick = () => send(S.state.paused ? "run" : "pause");

function fmtTime(ms) {
  const s = ms / 1000;
  if (s < 60) return s.toFixed(2) + " s";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = Math.floor(s % 60);
  return (h ? `${h}:${String(m).padStart(2, "0")}` : m) + ":" + String(r).padStart(2, "0");
}
const pctText = (x) => (x * 100).toFixed(1) + "%";
const compact = (n) => (n >= 1e9 ? (n / 1e9).toFixed(1) + "G" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(Math.round(n)));

function renderStats() {
  const g = S.progress, m = S.meta;
  if (!g || !m) return;
  $("acc-v").textContent = g.images ? pctText(g.acc) : "–";
  const lt = S.tests[S.tests.length - 1];
  $("test-v").textContent = lt ? pctText(lt[1]) : "–";
  $("epoch-v").textContent = `${g.epoch + 1}/${m.epochs}` + (g.learn ? "" : " test");
  $("image-v").textContent = `${(g.index + 1).toLocaleString()}/${g.total.toLocaleString()}`;
  $("clock-v").textContent = fmtTime(g.steps);
  $("ips-v").textContent = S.state.paused || S.state.done ? "0" : Math.round(g.ips).toLocaleString();
  $("spk-v").textContent = g.synops > 0 ? compact(g.spikes) : "–";
  $("syn-v").textContent = g.synops > 0 ? compact(g.synops) : "–";
  if (view && view.stats) view.stats();
}

// ---- canvases -----------------------------------------------------------------------------
function fit(c) {
  const d = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return null;
  const W = Math.round(w * d), Hh = Math.round(h * d);
  if (c.width !== W || c.height !== Hh) { c.width = W; c.height = Hh; }
  const x = c.getContext("2d");
  x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, h);
  return { x, w, h };
}

function rulers(x, w, h) {
  x.strokeStyle = pa(0.25); x.lineWidth = 1; x.beginPath();
  for (let xx = 0; xx < w; xx += 10) { const L = xx % 100 === 0 ? 8 : xx % 50 === 0 ? 5 : 3; x.moveTo(xx + 0.5, 0); x.lineTo(xx + 0.5, L); x.moveTo(xx + 0.5, h); x.lineTo(xx + 0.5, h - L); }
  for (let yy = 0; yy < h; yy += 10) { const L = yy % 100 === 0 ? 8 : yy % 50 === 0 ? 5 : 3; x.moveTo(0, yy + 0.5); x.lineTo(L, yy + 0.5); x.moveTo(w, yy + 0.5); x.lineTo(w - L, yy + 0.5); }
  x.stroke();
}

function bracket(x, cx, cy, r, l) {
  x.beginPath();
  for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { x.moveTo(cx + sx * r, cy + sy * (r - l)); x.lineTo(cx + sx * r, cy + sy * r); x.lineTo(cx + sx * (r - l), cy + sy * r); }
  x.stroke();
}

let accGeom = null;
function drawAcc() {
  const g = fit($("acc"));
  if (!g) return;
  const { x, w, h } = g, L0 = 30, b = h - 4, top = 6, pts = S.acc;
  const maxX = Math.max(1, pts.length ? pts[pts.length - 1][0] : 1), X = (v) => L0 + (v / maxX) * (w - L0 - 6), Y = (a) => b - a * (b - top);
  accGeom = { X, maxX, L0 };
  x.font = `11px ${FH}`; x.textAlign = "right"; x.fillStyle = G[2];
  for (const a of [0, 0.5, 1]) { x.fillStyle = pa(0.12); x.fillRect(L0, Math.round(Y(a)), w - L0, 1); x.fillStyle = G[2]; x.fillText(a * 100 + "%", L0 - 5, Y(a) + 4); }
  if (pts.length > 1) {
    x.beginPath(); x.moveTo(X(pts[0][0]), Y(pts[0][1]));
    for (const [n, a] of pts) x.lineTo(X(n), Y(a));
    x.lineWidth = 2; x.lineJoin = "round"; x.strokeStyle = G[4]; x.stroke();
    x.lineTo(X(pts[pts.length - 1][0]), b); x.lineTo(X(pts[0][0]), b); x.closePath(); x.fillStyle = gb(0.1); x.fill();
  }
  for (const [n, a] of S.tests) {
    x.beginPath(); x.arc(X(n), Y(a), 6, 0, 7); x.fillStyle = G[9]; x.fill();
    x.beginPath(); x.arc(X(n), Y(a), 4, 0, 7); x.fillStyle = G.p; x.fill();
  }
  if (pts.length) { x.textAlign = "right"; x.fillStyle = G[2]; x.fillText(compact(maxX) + " images", w - 6, b - 6); }
  if (S.hover && S.hover.acc !== undefined) { x.fillStyle = pa(0.5); x.fillRect(Math.round(X(S.hover.acc[0])), top, 1, b - top); }
}

// ---- interaction --------------------------------------------------------------------------
const tip = $("tip");
function showTip(e, value, rest) {
  const b = document.createElement("b"); b.textContent = value;
  tip.replaceChildren(b, document.createTextNode(rest));
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(innerWidth - r.width - 8, e.clientX + 14) + "px";
  tip.style.top = Math.max(8, e.clientY - r.height - 10) + "px";
}
const hideTip = () => { tip.style.display = "none"; if (S.hover) { S.hover = null; dirty("acc"); } };
const local = (e) => { const r = e.currentTarget.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
$("acc").onpointermove = (e) => {
  if (!accGeom || S.acc.length < 2) return;
  const [mx] = local(e), n = ((mx - accGeom.L0) / Math.max(1, e.currentTarget.clientWidth - accGeom.L0 - 6)) * accGeom.maxX;
  let best = S.acc[0];
  for (const p of S.acc) if (Math.abs(p[0] - n) < Math.abs(best[0] - n)) best = p;
  S.hover = { acc: best }; dirty("acc");
  showTip(e, pctText(best[1]), `running · ${best[0].toLocaleString()} images`);
};
$("acc").onpointerleave = hideTip;

// blueprint corner marks on every panel
function corners(root) {
  for (const el of root.querySelectorAll(".bp")) if (!el.querySelector(":scope > i")) for (let k = 0; k < 4; k++) el.prepend(document.createElement("i"));
}
corners(document);

// ---- loop ---------------------------------------------------------------------------------
let lastStats = 0;
function frame(now) {
  if (S.meta) {
    const all = S.dirty.has("all");
    if (view) view.frame(all);
    if (all || S.dirty.has("acc")) drawAcc();
    if (now - lastStats > 250) { renderStats(); lastStats = now; }
    S.dirty.clear();
  }
  requestAnimationFrame(frame);
}
addEventListener("resize", () => dirty("all"));
renderControls();
