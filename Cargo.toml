[workspace]
resolver = "2"
members = ["crates/snn-core", "crates/snn-live", "mnist-snn-rs", "mnist-spncn-rs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[workspace.dependencies]
snn-core = { path = "crates/snn-core" }
snn-live = { path = "crates/snn-live" }
flate2 = "=1.1.1"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
tungstenite = "=0.26.2"

# tests train networks; unoptimised they take minutes
[profile.test]
opt-level = 2
