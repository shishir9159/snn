[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-cuda"
version = "0.1.0"
description = "Surrogate-gradient spiking network on CuPy or NumPy"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "cupy-cuda12x",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-cuda-nvrtc-cu12>=12.9.86",
    "nvidia-cublas-cu12>=12.9",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
mnist-sg-cuda = "sg_cuda.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
