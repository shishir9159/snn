[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "snn-live"
requires-python = ">=3.8"
dynamic = ["version"]

[tool.maturin]
module-name = "snn_live"

[dependency-groups]
dev = ["numpy"]

[tool.uv]
# rebuild when the Rust sources change, not only the packaging files
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../snn-core/src/**/*.rs" },
    { file = "../snn-live/src/**/*.rs" },
]
